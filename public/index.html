<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curriculum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Module picture, swapped in once you're inside a module -->
  <div class="backdrop" id="backdrop"></div>

  <!-- Standing infinity mark: gold on black, deliberately faint -->
  <div class="infinity" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
      <path class="infinity-base"
        d="M 10,50 C 10,25 35,25 50,50 C 65,75 90,75 90,50 C 90,25 65,25 50,50 C 35,75 10,75 10,50 Z"
        fill="none" stroke-width="0.45" pathLength="100" />
      <!-- a single short segment travelling the loop, so the mark reads as
           alive without ever pulling focus -->
      <path class="infinity-trace"
        d="M 10,50 C 10,25 35,25 50,50 C 65,75 90,75 90,50 C 90,25 65,25 50,50 C 35,75 10,75 10,50 Z"
        fill="none" stroke-width="0.7" pathLength="100" />
    </svg>
  </div>

  <header class="topbar">
    <button class="brand" id="brand" type="button">Curriculum</button>
    <div class="topbar-right">
      <span class="user-name" id="user-name"></span>
      <button class="logout" id="logout" type="button">Log out</button>
    </div>
  </header>

  <main id="view"></main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
