<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curriculum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Module key art, faded in once you're inside a module -->
  <div class="backdrop" id="backdrop"></div>

  <!-- Woven checker and a slow breathing aura over it -->
  <div class="checker" aria-hidden="true"></div>
  <div class="aura" aria-hidden="true"></div>

  <!-- Standing sacred geometry: seed of life inside a slow ring, with the
       infinity mark across it. Deliberately faint. -->
  <div class="sanctum" aria-hidden="true">
    <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
      <g class="sanctum-seed">
        <circle cx="200" cy="200" r="52" />
        <circle cx="200" cy="148" r="52" /><circle cx="200" cy="252" r="52" />
        <circle cx="245" cy="174" r="52" /><circle cx="245" cy="226" r="52" />
        <circle cx="155" cy="174" r="52" /><circle cx="155" cy="226" r="52" />
      </g>
      <circle class="sanctum-ring" cx="200" cy="200" r="150" />
      <circle class="sanctum-ring dashed" cx="200" cy="200" r="172" />
      <path class="infinity-base"
        d="M 110,200 C 110,163 148,163 170,200 C 192,237 230,237 230,200 C 230,163 192,163 170,200 C 148,237 110,237 110,200 Z"
        pathLength="100" />
      <path class="infinity-trace"
        d="M 110,200 C 110,163 148,163 170,200 C 192,237 230,237 230,200 C 230,163 192,163 170,200 C 148,237 110,237 110,200 Z"
        pathLength="100" />
    </svg>
  </div>

  <!-- Fine film grain over everything, so flat dark areas have some tooth -->
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <button class="brand" id="brand" type="button">
      <span class="brand-mark">∞</span>
      <span class="brand-word">Curriculum</span>
    </button>
    <div class="topbar-right">
      <button class="user-button" id="user-button" type="button"
              aria-expanded="false" aria-haspopup="menu" aria-controls="user-menu">
        <span class="user-sigil" id="user-sigil"></span>
        <span class="user-name" id="user-name"></span>
        <span class="user-caret" aria-hidden="true">▾</span>
      </button>
      <div class="user-menu" id="user-menu" role="menu">
        <span class="user-menu-email" id="user-menu-email"></span>
        <button class="user-menu-item" id="logout" type="button" role="menuitem">Log out</button>
      </div>
    </div>
  </header>

  <main id="view" class="app-arrive"></main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
