<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curriculum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="rail-header">
        <span class="rail-brand">Curriculum</span>
        <div class="rail-user">
          <span class="rail-user-name" id="rail-user-name"></span>
          <button class="rail-logout" id="rail-logout" type="button">Log out</button>
        </div>
      </div>
      <ul class="module-list" id="rail-modules"></ul>
    </aside>

    <main class="main">
      <section class="panel-section">
        <h2 class="section-title">Daily Rituals</h2>
        <div class="ritual-grid" id="rituals-list"></div>
      </section>

      <section class="panel-section">
        <h2 class="section-title">Continue Watching</h2>
        <div class="continue-list" id="continue-watching-list"></div>
      </section>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
